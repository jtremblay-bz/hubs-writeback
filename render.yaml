services:
  - type: web
    name: deal-update
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HUBSPOT_PROD_TOKEN
        sync: false
      - key: DEAL_UPDATE_SIGNING_SECRET
        sync: false
      - key: DEAL_UPDATE_INGEST_TOKEN
        sync: false
